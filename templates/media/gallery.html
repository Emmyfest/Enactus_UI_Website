{% extends 'base.html' %}{% block content %}<h1 class="h2">Gallery</h1><div class="tabs"><a class="tab{% if not current %} on{% endif %}" href="{% url 'gallery' %}">All</a>{% for v,l in cats %}<a class="tab{% if current == v %} on{% endif %}" href="?category={{ v }}">{{ l }}</a>{% endfor %}</div>
<div class="cards">{% for m in items %}<figure class="card glass" style="margin:0"><img src="{{ m.file.url }}" alt="{{ m.alt_text }}" loading="lazy" style="width:100%;border-radius:12px"><figcaption><h3 class="h3">{{ m.title }}</h3><p>{{ m.caption }}</p></figcaption></figure>{% empty %}<div class="glass card"><p>No photographs have been published yet.</p></div>{% endfor %}</div>{% endblock %}
