{% extends 'base.html' %}{% block content %}<div class="eyebrow">Enactus Academy</div><h1 class="h2">Courses</h1>
<form method="get" class="campaign-form"><input name="q" value="{{ q }}" placeholder="Search"> <select name="category"><option value="">All subjects</option>{% for v,l in cats %}<option value="{{ v }}"{% if cat == v %} selected{% endif %}>{{ l }}</option>{% endfor %}</select> <button class="btn" type="submit">Filter</button></form>
<div class="cards" style="margin-top:16px">{% for c in courses %}<a class="card glass" href="{% url 'course' c.slug %}"><div class="num">{{ c.get_category_display|upper }}</div><h3 class="h3">{{ c.title }}</h3><p>{{ c.description|truncatechars:130 }}</p></a>{% empty %}<div class="glass card"><p>No courses have been published yet.</p></div>{% endfor %}</div>{% endblock %}
