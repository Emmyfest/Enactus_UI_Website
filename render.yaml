# Plan names change over time. Confirm current names in the Render dashboard before deploying.
databases:
  - name: enactus-ui-db
    plan: basic-256mb
    region: oregon
services:
  - type: web
    name: enactus-ui
    runtime: python
    region: oregon          # keep identical to the database region (internal URL)
    plan: starter           # pre-deploy commands need a paid plan
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.8}
      - {key: DEBUG, value: "False"}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: enactus-ui-db, property: connectionString}}
      - {key: ALLOWED_HOSTS, value: ""}
      - {key: CSRF_TRUSTED_ORIGINS, sync: false}
