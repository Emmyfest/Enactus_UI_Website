databases:
  - name: enactus-ui-db
    plan: free
    region: oregon
services:
  - type: web
    name: enactus-ui
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.8}
      - {key: DEBUG, value: "False"}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: enactus-ui-db, property: connectionString}}
      - {key: ALLOWED_HOSTS, value: ""}
      - {key: CSRF_TRUSTED_ORIGINS, value: ""}
      - {key: DJANGO_SUPERUSER_EMAIL, sync: false}
      - {key: DJANGO_SUPERUSER_FULL_NAME, sync: false}
      - {key: DJANGO_SUPERUSER_PASSWORD, sync: false}
